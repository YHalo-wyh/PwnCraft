name: Recognizer training gate

on:
  push:
    branches:
      - main
      - "training/**"
  pull_request:
    branches:
      - main
    paths:
      - "pwncraft/pwncraft/features/heapviz/**"
      - "pwncraft/tests/**"
      - "autocorrect/**"
      - ".github/workflows/recognizer-training.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pwncraft/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pwncraft/requirements.txt
          python -m pip install pytest

      - name: Temporary pinned UBW libc instruction evidence
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/SycloverTeam/SCTF-2026/6e9cc7e92ce1749080e9d11ee99b678493d6e2d9/Pwn/UBW/attachments'
          curl -L --fail --silent --show-error "$base/libc.so.6" -o /tmp/ubw-libc.so.6
          curl -L --fail --silent --show-error "$base/UBW" -o /tmp/UBW
          echo '=== SHA256 ==='
          sha256sum /tmp/ubw-libc.so.6 /tmp/UBW
          echo '=== SETCONTEXT SYMBOL ==='
          readelf -Ws /tmp/ubw-libc.so.6 | grep -E ' setcontext(@@|@|$)' || true
          echo '=== SETCONTEXT ENTRY/RESTORE WINDOW ==='
          objdump -d -M intel --start-address=0x4a960 --stop-address=0x4aab8 /tmp/ubw-libc.so.6
          echo '=== ADD_RSP_38 WINDOW ==='
          objdump -d -M intel --start-address=0x12dfba --stop-address=0x12dfc8 /tmp/ubw-libc.so.6
          echo '=== POP_RSP WINDOW ==='
          objdump -d -M intel --start-address=0x3c068 --stop-address=0x3c074 /tmp/ubw-libc.so.6
          echo '=== UBW GNU PROPERTY NOTES ==='
          readelf -nW /tmp/UBW || true

      - name: Project regression
        working-directory: pwncraft
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests

      - name: Training infrastructure regression
        env:
          PYTHONPATH: pwncraft
        run: python -m pytest -q autocorrect/tests

      - name: Accepted truth regression
        env:
          PYTHONPATH: pwncraft
        run: python autocorrect/truthregress_ci.py
