name: Recognizer training gate

on:
  push:
    branches:
      - "training/**"
  pull_request:
    branches:
      - main
    paths:
      - "pwncraft/pwncraft/features/heapviz/**"
      - "pwncraft/tests/**"
      - "autocorrect/**"
      - ".github/workflows/recognizer-training.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: pwncraft
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pwncraft/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pwncraft/requirements.txt
          python -m pip install pytest

      - name: Project regression
        run: python -m pytest -q pwncraft/tests

      - name: Training infrastructure regression
        run: python -m pytest -q autocorrect/tests
