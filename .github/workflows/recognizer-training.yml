name: Recognizer training gate

on:
  push:
    branches:
      - "training/**"
  pull_request:
    branches:
      - main
    paths:
      - "pwncraft/pwncraft/features/heapviz/**"
      - "pwncraft/tests/**"
      - "autocorrect/**"
      - ".github/workflows/recognizer-training.yml"

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Apply one-time truthregress artifact-gate repair
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cycle4-artifact-gate]')
        run: |
          python - <<'PY'
          from pathlib import Path

          comparator = Path('autocorrect/comparator_v4.py')
          text = comparator.read_text(encoding='utf-8')
          old = '''def compare(expected_truth_raw: dict, actual: dict, exp_source: str = "",
                      renderer_plan=None, collect_all: bool = False,
                      contract=None) -> dict:
              report = {'''.replace('            ', '')
          new = '''def compare(expected_truth_raw: dict, actual: dict, exp_source: str = "",
                      renderer_plan=None, collect_all: bool = False,
                      contract=None, artifact_dir=None) -> dict:
              report = {'''.replace('            ', '')
          if old not in text and new not in text:
              raise SystemExit('unexpected comparator signature')
          text = text.replace(old, new, 1)
          old2 = '''    }
              fail, ctx = _prepare_ctx(expected_truth_raw, actual, exp_source,
                                       renderer_plan, contract)'''.replace('            ', '')
          new2 = '''    }
              if artifact_dir is not None:
                  report["_case_dir"] = str(artifact_dir)
              fail, ctx = _prepare_ctx(expected_truth_raw, actual, exp_source,
                                       renderer_plan, contract)'''.replace('            ', '')
          if old2 not in text and new2 not in text:
              raise SystemExit('unexpected comparator report boundary')
          text = text.replace(old2, new2, 1)
          comparator.write_text(text, encoding='utf-8')

          loop = Path('autocorrect/loop.py')
          text = loop.read_text(encoding='utf-8')
          old = '''    registered = [c["case_id"] if isinstance(c, dict) else c
                  for c in registry["case_acceptances"]]'''
          new = '''    registered = list(dict.fromkeys(
        c["case_id"] if isinstance(c, dict) else c
        for c in registry["case_acceptances"]
    ))'''
          if old not in text and new not in text:
              raise SystemExit('unexpected truthregress registry block')
          text = text.replace(old, new, 1)

          old = '''        result = pwncraft_adapter.run_case(resolve_case(case_id))
        contract = evaluation_contract.load_contract(cdir)
        report = comparator_v4.compare(expected, result,
                                       exp_source=exp_path.read_text(encoding="utf-8"),
                                       contract=contract)'''
          new = '''        gen_dir = cdir / "generated" / "truthregress"
        result = pwncraft_adapter.run_case(
            resolve_case(case_id), out_path=gen_dir / "pwncraft_output.json")
        contract = evaluation_contract.load_contract(cdir)
        report = comparator_v4.compare(
            expected, result,
            exp_source=exp_path.read_text(encoding="utf-8"),
            contract=contract,
            artifact_dir=gen_dir)'''
          if old not in text and new not in text:
              raise SystemExit('unexpected truthregress run/compare block')
          text = text.replace(old, new, 1)

          old = '''    report = comparator_v4.compare(expected, actual, exp_source=exp_source,
                                   renderer_plan=renderer_plan,
                                   contract=contract)'''
          new = '''    report = comparator_v4.compare(expected, actual, exp_source=exp_source,
                                   renderer_plan=renderer_plan,
                                   contract=contract,
                                   artifact_dir=actual_path.parent)'''
          if old not in text and new not in text:
              raise SystemExit('unexpected diverge compare block')
          text = text.replace(old, new, 1)

          old = '''    registry.setdefault(f"{args.kind}_acceptances", []).append(entry)
    registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2),
                             encoding="utf-8")
    print(f"[accept] {args.kind}: {args.case}"
          + (f" @ {args.layer}" if args.layer else ""))'''
          new = '''    bucket = registry.setdefault(f"{args.kind}_acceptances", [])
    identity = (args.case, args.kind, args.layer or "")
    if any((str(item.get("case_id") or ""), str(item.get("kind") or args.kind),
            str(item.get("layer") or "")) == identity
           for item in bucket if isinstance(item, dict)):
        print(f"[accept] already registered: {args.kind}: {args.case}"
              + (f" @ {args.layer}" if args.layer else ""))
        return
    bucket.append(entry)
    registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2),
                             encoding="utf-8")
    print(f"[accept] {args.kind}: {args.case}"
          + (f" @ {args.layer}" if args.layer else ""))'''
          if old not in text and new not in text:
              raise SystemExit('unexpected accept append block')
          text = text.replace(old, new, 1)
          loop.write_text(text, encoding='utf-8')

          marker = Path('autocorrect/patches/cycle-4/.artifact-gate')
          if marker.exists():
              marker.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet; then
            git add autocorrect/comparator_v4.py autocorrect/loop.py autocorrect/patches/cycle-4/.artifact-gate
            git commit -m "autocorrect: make truthregress artifact-aware and idempotent"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pwncraft/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pwncraft/requirements.txt
          python -m pip install pytest

      - name: Project regression
        working-directory: pwncraft
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests

      - name: Training infrastructure regression
        env:
          PYTHONPATH: pwncraft
        run: python -m pytest -q autocorrect/tests

      - name: Accepted truth regression
        env:
          PYTHONPATH: pwncraft
        run: python autocorrect/loop.py truthregress
